services:
  mlops-idp:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in deploy/.env}
      KC_HOSTNAME: http://mlops-idp:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./realm-mlops.json:/opt/keycloak/data/import/realm-mlops.json:ro
      - idp-data:/opt/keycloak/data/h2
    ports:
      - "8080:8080"
    networks:
      - mlops
volumes:
  idp-data:
networks:
  mlops:
    name: mlops
    external: true
