services:
  mlops-idp:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in deploy/.env}
      KC_HOSTNAME: http://mlops-idp:8180
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      MLOPS_IDP_SYNC_SECRET: ${IDP_SYNC_SECRET:?set IDP_SYNC_SECRET in deploy/.env}
    volumes:
      - ./realm-mlops.json:/opt/keycloak/data/import/realm-mlops.json:ro
      - ../data/idp:/opt/keycloak/data/h2
    ports:
      - "8180:8180"
    networks:
      - mlops
networks:
  mlops:
    name: mlops
    external: true
