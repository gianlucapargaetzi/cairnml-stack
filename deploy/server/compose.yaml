services:
  mlops-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: mlops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mlops
  mlops-server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: mlops-server:dev
    depends_on:
      mlops-postgres:
        condition: service_healthy
    environment:
      MLOPS_DATABASE_URL: postgresql+psycopg://mlops:${POSTGRES_PASSWORD}@mlops-postgres:5432/mlops
      MLOPS_PUBLIC_URL: ${MLOPS_SERVER_URL}
      MLOPS_SIGNING_KEY_PATH: /run/secrets-dir/signing.pem
      MLOPS_OIDC_ISSUER: ${MLOPS_IDP_ISSUER}
      MLOPS_GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      MLOPS_GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets-dir/github-app.pem
      MLOPS_GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      MLOPS_S3_ENDPOINT: ${MLOPS_NAS_URL}
      MLOPS_S3_ACCESS_KEY: ${MLOPS_S3_ACCESS_KEY}
      MLOPS_S3_SECRET_KEY: ${MLOPS_S3_SECRET_KEY}
      MLOPS_IDP_SYNC_CLIENT_SECRET: ${IDP_SYNC_SECRET}
      MLOPS_IDP_SYNC_INTERVAL: ${IDP_SYNC_INTERVAL:-60}
    volumes:
      # The whole secrets directory is mounted read-only: github-app.pem may not exist yet, and
      # the server only reads it when GITHUB_APP_ID is set.
      - ../secrets:/run/secrets-dir:ro
    ports:
      - "8000:8000"
    networks:
      - mlops
      # Job containers reach the server here; they are not on mlops.
      - mlops-jobs
volumes:
  pgdata:
networks:
  mlops:
    name: mlops
    external: true
  mlops-jobs:
    name: mlops-jobs
