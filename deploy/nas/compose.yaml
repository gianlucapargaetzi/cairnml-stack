services:
  mlops-nas:
    # Pinned by digest: this is the image the S3 and STS behaviour was checked against.
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD in deploy/.env}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ../data/nas:/data
    ports:
      # S3 API on the LAN (agents and clients need it); console on loopback only.
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mlops
  mlops-nas-init:
    image: python:3.12-slim
    depends_on:
      mlops-nas:
        condition: service_healthy
    command: ["python", "/init.py"]
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD}
      MLOPS_S3_ACCESS_KEY: ${MLOPS_S3_ACCESS_KEY}
      MLOPS_S3_SECRET_KEY: ${MLOPS_S3_SECRET_KEY}
    volumes:
      - ./init.py:/init.py:ro
    restart: "no"
    networks:
      - mlops
networks:
  mlops:
    name: mlops
    external: true
