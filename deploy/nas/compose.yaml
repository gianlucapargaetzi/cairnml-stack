services:
  mlops-nas:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    volumes:
      - nas-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mlops
  mlops-nas-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      mlops-nas:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MLOPS_S3_ACCESS_KEY: ${MLOPS_S3_ACCESS_KEY}
      MLOPS_S3_SECRET_KEY: ${MLOPS_S3_SECRET_KEY}
    volumes:
      - ./init.sh:/init.sh:ro
    restart: "no"
    networks:
      - mlops
volumes:
  nas-data:
networks:
  mlops:
    name: mlops
    external: true
