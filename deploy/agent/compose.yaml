services:
  mlops-agent:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    image: mlops-agent:dev
    environment:
      MLOPS_AGENT_HOME: ${MLOPS_AGENT_HOME:-/var/lib/mlops-agent}
      MLOPS_AGENT_SERVER_URL: ${MLOPS_SERVER_URL}
      MLOPS_AGENT_JOB_SERVER_URL: ${MLOPS_SERVER_URL}
      MLOPS_AGENT_JOB_NETWORK: mlops
      MLOPS_AGENT_ENROLL_TOKEN: ${MLOPS_AGENT_ENROLL_TOKEN:-}
      MLOPS_AGENT_NAME: ${MLOPS_AGENT_NAME:-local-agent}
      MLOPS_AGENT_WHEELS_DIR: ${MLOPS_AGENT_HOME:-/var/lib/mlops-agent}/wheels
      MLOPS_AGENT_CLIENT_PIP_SPEC: ${MLOPS_AGENT_CLIENT_PIP_SPEC:-mlops-client}
      MLOPS_AGENT_GIT_WEB_URL: ${GITHUB_WEB_URL:-https://github.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MLOPS_AGENT_HOME:-/var/lib/mlops-agent}:${MLOPS_AGENT_HOME:-/var/lib/mlops-agent}
    restart: unless-stopped
    networks:
      - mlops
networks:
  mlops:
    name: mlops
    external: true
