[project]
name = "mlops-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyjwt[crypto]>=2.8", "cryptography>=42", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_common"]
