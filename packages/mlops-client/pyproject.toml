[project]
name = "mlops-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mlops-common", "typer>=0.12", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dvc = ["dvc[s3]>=3.50"]

[project.scripts]
mlops = "mlops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops"]
