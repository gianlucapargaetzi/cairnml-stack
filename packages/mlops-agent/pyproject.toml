[project]
name = "mlops-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mlops-common", "typer>=0.12", "docker>=7.1", "pydantic-settings>=2.4", "httpx>=0.27", "psutil>=5.9"]

[project.scripts]
mlops-agent = "mlops_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_agent"]
