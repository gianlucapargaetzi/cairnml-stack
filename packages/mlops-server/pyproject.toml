[project]
name = "mlops-server"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "mlops-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "boto3>=1.34",
  "httpx>=0.27",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_server"]
