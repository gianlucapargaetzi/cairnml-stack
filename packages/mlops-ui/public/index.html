<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Replaceable with base path -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="MLOps Flow: experiment tracking and job control"
    />


    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <style>
      .preloader {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        left: 0;
        background-color: #fff;
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .preloader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .preloader svg {
        transform: scale(1.5);
      }

      .progress-bar {
        height: 4px;
        border-radius: 1px;
        background-color: #f2f5fa;
        overflow: hidden;
        margin-top: 50px;
        width: 100px;
      }

      .progress-bar-value {
        width: 100%;
        height: 100%;
        background-color: #4b9bff;
        animation: progress-animation 1s infinite linear;
        transform-origin: 0% 50%;
      }

      @keyframes progress-animation {
        0% {
          transform: translateX(0) scaleX(0);
        }

        40% {
          transform: translateX(0) scaleX(0.4);
        }

        100% {
          transform: translateX(100%) scaleX(0.5);
        }
      }
    </style>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <link
      rel="preload"
      as="script"
      href="%PUBLIC_URL%/vs/editor/editor.main.js"
      crossorigin
    />

    <link
      rel="preload"
      as="font"
      href="%PUBLIC_URL%/assets/inter/fonts/Inter.ttf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      href="%PUBLIC_URL%/assets/inconsolata/fonts/Inconsolata.ttf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      href="%PUBLIC_URL%/assets/icomoon/fonts/icomoon.eot"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      href="%PUBLIC_URL%/assets/icomoon/fonts/icomoon.ttf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      href="%PUBLIC_URL%/assets/icomoon/fonts/icomoon.woff"
      crossorigin
    />

    <link rel="stylesheet" href="%PUBLIC_URL%/assets/inter/inter.css" />
    <link
      rel="stylesheet"
      href="%PUBLIC_URL%/assets/inconsolata/inconsolata.css"
    />
    <link
      rel="stylesheet"
      href="%PUBLIC_URL%/assets/icomoon/icomoonIcons.css"
    />
    <title>MLOps Flow</title>

    <script src="%PUBLIC_URL%/runtime-config.js"></script>
