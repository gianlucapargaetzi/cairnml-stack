# The stack the end-to-end suite runs against. It is a second, separate stack: its own compose project, its own
# state folder, its own secrets, realm and accounts, and its own ports on this machine's network address. It does
# not use deploy/ at all. support/stack.py starts it with the variables below set in the environment.
#
# Variables (set by the suite, not by hand):
#   E2E_HOST           this machine's network address, reachable from the host and from the containers
#   E2E_STATE          the state folder (data, secrets, the realm file)
#   E2E_API_PORT, E2E_WEB_PORT, E2E_IDP_PORT, E2E_STORAGE_PORT   the published ports
#   E2E_RUSTFS_USER, E2E_RUSTFS_PASSWORD, E2E_KC_ADMIN, E2E_KC_ADMIN_PASSWORD, E2E_S3_ACCESS_KEY
#
# The service names are the ones the server's web app expects (it finds the API server by the name "apiserver").
# The storage init script is copied into the state folder by support/stack.py.

x-clearml-build: &clearml_build
  build:
    context: ../../../clearml-server
    dockerfile: docker/build/Dockerfile
    additional_contexts:
      clearml_web: ../../../clearml-web
  image: clearml-server-fork:local
  restart: "no"

services:
  idp:
    image: quay.io/keycloak/keycloak:26.0
    restart: "no"
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${E2E_KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${E2E_KC_ADMIN_PASSWORD}
      KC_HOSTNAME: http://${E2E_HOST}:${E2E_IDP_PORT}
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ${E2E_STATE}/realm-mlops.json:/opt/keycloak/data/import/realm-mlops.json:ro
      - ${E2E_STATE}/data/idp:/opt/keycloak/data/h2
    ports:
      - "${E2E_HOST}:${E2E_IDP_PORT}:8180"
    networks: [e2e]

  rustfs:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    restart: "no"
    environment:
      RUSTFS_ACCESS_KEY: ${E2E_RUSTFS_USER}
      RUSTFS_SECRET_KEY: ${E2E_RUSTFS_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ${E2E_STATE}/data/rustfs:/data
    ports:
      - "${E2E_HOST}:${E2E_STORAGE_PORT}:9000"
    networks: [e2e]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  rustfs-init:
    image: python:3.12-slim
    depends_on:
      rustfs:
        condition: service_healthy
    command: ["python", "/init.py"]
    environment:
      MLOPS_STORAGE_ENDPOINT: http://rustfs:9000
      RUSTFS_ROOT_USER: ${E2E_RUSTFS_USER}
      RUSTFS_ROOT_PASSWORD: ${E2E_RUSTFS_PASSWORD}
      MLOPS_S3_ACCESS_KEY: ${E2E_S3_ACCESS_KEY}
      MLOPS_S3_SECRET_KEY_FILE: /run/secrets-dir/s3_secret_key
    volumes:
      - ${E2E_STATE}/init.py:/init.py:ro
      - ${E2E_STATE}/secrets:/run/secrets-dir:ro
    restart: "no"
    networks: [e2e]

  mongo:
    image: mongo:8.0.15
    restart: "no"
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
      - ${E2E_STATE}/data/mongo/db:/data/db
      - ${E2E_STATE}/data/mongo/configdb:/data/configdb
    networks: [backend]

  redis:
    image: redis:8.2.3
    restart: "no"
    volumes:
      - ${E2E_STATE}/data/redis:/data
    networks: [backend]

  elasticsearch:
    image: elasticsearch:8.19.9
    restart: "no"
    environment:
      bootstrap.memory_lock: "true"
      cluster.name: clearml
      cluster.routing.allocation.node_initial_primaries_recoveries: "500"
      cluster.routing.allocation.disk.watermark.low: 500mb
      cluster.routing.allocation.disk.watermark.high: 500mb
      cluster.routing.allocation.disk.watermark.flood_stage: 500mb
      discovery.type: "single-node"
      http.compression_level: "7"
      node.name: clearml
      reindex.remote.whitelist: "'*.*'"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${E2E_STATE}/data/elastic:/usr/share/elasticsearch/data
    networks: [backend]

  apiserver:
    <<: *clearml_build
    command: [apiserver]
    depends_on:
      - redis
      - mongo
      - elasticsearch
      - rustfs-init
      - idp
    environment:
      CLEARML_SECRETS_DIR: /run/secrets-dir
      CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
      CLEARML__apiserver__idp__issuer: http://${E2E_HOST}:${E2E_IDP_PORT}/realms/mlops
      CLEARML__apiserver__idp__public_url: http://${E2E_HOST}:${E2E_API_PORT}
      CLEARML__apiserver__idp__web_url: http://${E2E_HOST}:${E2E_WEB_PORT}
      CLEARML__apiserver__idp__web_client_id: clearml-web
      CLEARML__apiserver__idp__sdk_client_id: clearml-sdk
      CLEARML__apiserver__idp__directory_client_id: clearml-server
      CLEARML__apiserver__idp__sync_enabled: "true"
      CLEARML__apiserver__idp__admin_role: mlops-admin
      CLEARML__apiserver__auth__cookies__secure: "false"
      CLEARML__apiserver__idp__github_app_id: ""
      CLEARML__apiserver__idp__github_api_url: https://api.github.com
      CLEARML__services__async_urls_delete__enabled: "true"
      CLEARML__apiserver__storage__endpoint: http://rustfs:9000
      CLEARML__apiserver__storage__public_endpoint: http://${E2E_HOST}:${E2E_STORAGE_PORT}
      CLEARML__apiserver__storage__access_key: ${E2E_S3_ACCESS_KEY}
    volumes:
      - ${E2E_STATE}/data/logs:/var/log/clearml
      - ${E2E_STATE}/secrets:/run/secrets-dir:ro
    ports:
      - "${E2E_HOST}:${E2E_API_PORT}:8008"
    networks: [backend, frontend, e2e]

  async-delete:
    image: clearml-server-fork:local
    pull_policy: never
    restart: "no"
    command: [async_delete]
    depends_on:
      - redis
      - mongo
      - rustfs-init
    environment:
      CLEARML_SECRETS_DIR: /run/secrets-dir
      CLEARML_MONGODB_SERVICE_HOST: mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
      CLEARML__apiserver__storage__endpoint: http://rustfs:9000
      CLEARML__apiserver__storage__public_endpoint: http://${E2E_HOST}:${E2E_STORAGE_PORT}
      CLEARML__apiserver__storage__access_key: ${E2E_S3_ACCESS_KEY}
      CLEARML__services__async_urls_delete__enabled: "true"
    volumes:
      - ${E2E_STATE}/data/logs:/var/log/clearml
      - ${E2E_STATE}/secrets:/run/secrets-dir:ro
    networks: [backend, e2e]

  webserver:
    image: clearml-server-fork:local
    pull_policy: never
    restart: "no"
    command: [webserver]
    depends_on:
      - apiserver
    volumes:
      # The web app finds its API on port 8008 of the same host unless this file says otherwise; here it says
      # to use the web server's own /api route (see E2E.md, "Addresses").
      - ${E2E_STATE}/configs:/mnt/external_files/configs:ro
    ports:
      - "${E2E_HOST}:${E2E_WEB_PORT}:80"
    networks: [backend, frontend]

networks:
  backend:
  frontend:
  e2e:
